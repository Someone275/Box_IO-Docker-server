# Copy this file to .github/workflows/docker-image.yml to publish on each push to main.
# Committing that path requires a token with the workflow scope.
name: Publish box_io-docker-server

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json | head -n 1)
          echo "name=ghcr.io/${owner}/box_io-docker-server" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: steps.meta.outputs.dockerhub == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.name }}:latest
            ${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=box_io-docker-server

      - name: Make the GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/box_io-docker-server/visibility" \
            -f visibility=public

      - name: Also push the Docker Hub tag
        if: steps.meta.outputs.dockerhub == 'true'
        run: |
          hub="${{ secrets.DOCKERHUB_USERNAME }}/box_io-docker-server"
          docker buildx imagetools create \
            --tag "${hub}:latest" \
            --tag "${hub}:${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.version }}"
