worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # All HTTP traffic is forwarded to HTTPS (ACME challenge stays on 80).
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost _;

    # Let's Encrypt HTTP-01. Files live at
    # /var/www/certbot/.well-known/acme-challenge/<token>
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
      allow all;
    }

    # Diagnostic: from a phone on cellular this must print boxio-http-ok
    # If LAN works and cellular times out, port 80 is not actually reaching nginx from the WAN.
    location = /http-ok {
      default_type text/plain;
      return 200 "boxio-http-ok\n";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /ws {
      proxy_pass http://127.0.0.1:3847;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 5s;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      proxy_pass http://127.0.0.1:3847;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }
  }
}
