worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  # A timed-out proxy socket is reset so the next request opens a new one.
  reset_timedout_connection on;
  # Docker's DNS. A variable in proxy_pass makes nginx look the name up
  # again after the app container is recreated, instead of keeping a dead address.
  resolver 127.0.0.11 valid=5s ipv6=off;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # The dashboard on port 80 is forwarded to HTTPS. API, device, and
  # websocket calls stay on port 80: the phone and Windows apps POST
  # login over HTTP and do not follow a 301. That page is HTML, and the
  # app then fails while reading it as JSON.
  # The proxy has its own network and calls the app by name. Sharing the
  # app container's network made 127.0.0.1 accept a connection and then
  # drop the reply, so the first page worked and the next ones waited
  # until the gateway timed out. The program itself never logged that.
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost _;
    set $boxio_upstream boxio:3847;

    # Let's Encrypt HTTP-01. Files live at
    # /var/www/certbot/.well-known/acme-challenge/<token>
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
      allow all;
    }

    # Diagnostic: from a phone on cellular this must print boxio-http-ok
    # If LAN works and cellular times out, port 80 is not actually reaching nginx from the WAN.
    location = /http-ok {
      default_type text/plain;
      return 200 "boxio-http-ok\n";
    }

    location /api/ {
      proxy_pass http://$boxio_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "close";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_intercept_errors on;
      error_page 502 504 = @boxio_down;
    }

    location /public/ {
      proxy_pass http://$boxio_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "close";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    location /hw/ {
      proxy_pass http://$boxio_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "close";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    location /ws {
      proxy_pass http://$boxio_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      return 301 https://$host$request_uri;
    }

    location @boxio_down {
      default_type application/json;
      return 503 '{"error":"Box IO is not answering. Restart the Box IO containers."}';
    }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;
    set $boxio_upstream boxio:3847;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /ws {
      proxy_pass http://$boxio_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 5s;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /api/ {
      proxy_pass http://$boxio_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "close";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_intercept_errors on;
      error_page 502 504 = @boxio_down;
    }

    location / {
      proxy_pass http://$boxio_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "close";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    location @boxio_down {
      default_type application/json;
      return 503 '{"error":"Box IO is not answering. Restart the Box IO containers."}';
    }
  }
}
